# Lil Kifu & Lil Nao settings. Edit this file on GitHub (pencil icon) and commit; a check runs right away.

[twitch]
# Lil Kifu announces when these Twitch streamers go live (usernames or twitch.tv links).
streamers = [
    "loskirin",
]
# Who gets pinged: "" for nobody, "everyone", or a role ID
# (Discord: turn on Developer Mode, then Server Settings > Roles > right-click a role > Copy Role ID).
ping = ""
# Name and picture of the messages. Leave empty to use the webhook's own name and avatar.
name = "Lil Kifu"
avatar_url = ""
# Show a "Watch Stream" button under live notifications.
watch_button = true

[tiktok]
# Lil Nao announces new posts from these TikTok accounts. Write each name the way it should
# appear in Discord, e.g. "BeagleMommy". Accounts are checked about every 15 minutes.
accounts = [
    "renaissance.guild",
    "thezunkist",
    "_ganzalf",
    "dulceteaa",
    "arvyss00",
    "wwm_eldravn",
    "delvankia",
    "astral_dew",
    "yoruuy",
    "wanping05",
]
ping = ""
name = "Lil Nao"
