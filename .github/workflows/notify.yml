name: Twitch notifications

on:
  schedule:
    - cron: "*/30 * * * *"  # backup only: the panel Worker starts a check every 5 minutes
  workflow_dispatch:        # "Run workflow" button, and the panel Worker's 5-minute timer
    inputs:
      source:
        description: Who started this check
        required: false
        default: manual
  push:
    branches: [main]
    paths: [config.toml]   # check right away after the settings change

permissions:
  contents: write          # commit state.json

concurrency:
  group: twitch-notifications
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The newest state, not the commit that queued this run: a run that waited for the one
          # before it must see what that run already posted.
          ref: main

      - name: Check Twitch and TikTok, update Discord
        id: notify
        run: python3 notify.py
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_TIKTOK_WEBHOOK_URL: ${{ secrets.DISCORD_TIKTOK_WEBHOOK_URL }}
          RUN_SOURCE: ${{ inputs.source || github.event_name }}

      - name: Save state
        # Also after a failed check: what was already posted must be remembered, or it gets posted again.
        if: ${{ !cancelled() && steps.notify.outputs.changed == 'true' }}
        env:
          MESSAGE: ${{ steps.notify.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit --quiet -m "$MESSAGE"
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 5
          done
          exit 1
